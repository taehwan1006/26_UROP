# ThinDyUNet Training Configuration
# 논문: Section 5.2 Implementation Details

# Data
data:
  images_root: "data/raw/images"
  masks_root: "data/raw/masks"
  img_size: [512, 512]
  num_workers: 4
  # 시퀀스별 stride 샘플링 (1=전체, 10=10%, 20=5%)
  train_stride: 20
  val_stride: 20

# Model
model:
  name: "ThinDyUNet"
  in_channels: 3
  n_classes: 1
  base_ch: 64
  n_kernels: 3

# Training
training:
  batch_size: 4              # 실제 micro-batch (RTX 4070S 12GB 안전)
  accumulation_steps: 6      # 4 x 6 = 24 (논문 동일 effective batch)
  max_epochs: 50
  learning_rate: 0.0001      # 1e-4
  early_stopping_patience: 10
  save_dir: "checkpoints"
  log_interval: 100          # 매 N 배치마다 로그 출력

# Loss
loss:
  type: "bce_with_logits"  # BCEWithLogitsLoss (sigmoid 내장)
