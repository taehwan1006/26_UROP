# ThinDyUNet Training Configuration (stride=10, 10% 데이터)
# 원본 train_config.yaml의 stride=20 결과와 비교용

# Data
data:
  images_root: "data/raw/images"
  masks_root: "data/raw/masks"
  img_size: [512, 512]
  num_workers: 4
  # train: 10% 사용, val: 5% 유지 (이전 실험과 동일 val set으로 직접 비교)
  train_stride: 10
  val_stride: 20

# Model
model:
  name: "ThinDyUNet"
  in_channels: 3
  n_classes: 1
  base_ch: 64
  n_kernels: 3

# Training
training:
  batch_size: 4
  accumulation_steps: 6      # 4 x 6 = 24 (논문 동일 effective batch)
  max_epochs: 50
  learning_rate: 0.0001
  early_stopping_patience: 10
  save_dir: "checkpoints/stride10"  # 원본 보존
  log_interval: 100

# Loss
loss:
  type: "bce_with_logits"
