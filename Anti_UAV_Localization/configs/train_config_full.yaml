# ThinDyUNet Full-Data Training Configuration
# 논문 베이스 + 우리 검증된 개선 통합 (train_full.py 전용)
#
# 적용된 논문 설정:
#   AdamW, DiceLoss (또는 BCE+Dice combo), ReduceLROnPlateau, stride=1
# 유지된 우리 개선:
#   ImageNet Normalize, shuffle=True, N-fold 효율 conv, N=3

# Data
data:
  images_root: "data/raw/images"
  masks_root: "data/raw/masks"
  img_size: [512, 512]
  num_workers: 8            # A5000 NAS 환경
  train_stride: 1           # 전체 train 프레임 (~304K)
  val_stride: 20            # val은 5%로 빠르게 (~6K, 이전 실험과 동일 set)

# Model
model:
  name: "ThinDyUNet"
  in_channels: 3
  n_classes: 1
  base_ch: 64
  n_kernels: 3

# Training
training:
  # Batch (A5000 24GB 가정 — OOM이면 batch=4, accum=6 로 조정)
  batch_size: 8
  accumulation_steps: 3     # 8 × 3 = 24 (논문 effective batch)

  # Optimization
  max_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 12   # 풀 데이터는 plateau 후에도 회복 여지

  # LR Scheduler (논문: ReduceLROnPlateau)
  scheduler:
    factor: 0.15
    patience: 5             # full data 1 epoch이 길어서 patience 작게
    cooldown: 3
    min_lr: 0.0000001

  # Loss
  loss:
    name: "bce_dice"        # "bce", "dice", "bce_dice" 중 하나
    bce_weight: 0.5
    dice_weight: 0.5

  # AMP (A5000 tensor core 있지만 N-fold 패턴상 효과 불확실)
  amp_enabled: false

  # I/O
  save_dir: "checkpoints/full"
  log_interval: 500          # full data는 iteration이 많아서 띄엄띄엄
  ckpt_every_epochs: 5       # 매 5 epoch마다 epoch_NN.pth 저장 (롤백용)
